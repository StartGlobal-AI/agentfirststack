name: Bug report
description: Something doesn't work the way the manual says it should.
labels: [bug]
body:
  - type: dropdown
    id: service
    attributes:
      label: Service
      options: [analytics, tags, mail, site / signup, deployment tool (pnpm afs), docs]
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Hosted (agentfirststack.com), Self-hosted, Local development]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The request you made (redact keys), the response you got, and what you expected instead.
      placeholder: |
        POST https://mail.agentfirststack.com/v1/inboxes {"username":"..."}
        -> 500 {"error":{...}}
        Expected: 201 with the inbox
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version or commit (self-hosted)
